name: Test, build and publish 0.14b
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt pytest
      - run: python tools/build_dw3_converter.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: node --check www/app.js && node tests/test_native_anim.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.12,<7'
      - run: python tools/build_dw3_converter.py
        env:
          CXX: cl
      - run: python -m PyInstaller --noconfirm --clean DW2_3D_Viewer_Studio.spec
      - run: python tools/smoke_windows.py dist/DW2_3D_Viewer_Studio/DW2_3D_Viewer_Studio.exe
      - name: Package Windows application
        shell: pwsh
        run: |
          Copy-Item README.md dist/DW2_3D_Viewer_Studio/README.md
          Copy-Item RELEASE_NOTES_0.14b.md dist/DW2_3D_Viewer_Studio/RELEASE_NOTES_0.14b.md
          Compress-Archive -Path dist/DW2_3D_Viewer_Studio -DestinationPath DW2_DW3_Viewer_0.14b_Windows_x64.zip
          Get-FileHash DW2_DW3_Viewer_0.14b_Windows_x64.zip -Algorithm SHA256 | Format-List | Out-File SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-0.14b
          path: |
            DW2_DW3_Viewer_0.14b_Windows_x64.zip
            windows-smoke.json
            SHA256SUMS.txt
      - name: Publish verified beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api repos/${{ github.repository }}/commits/main --jq .sha
          if ($head -ne '${{ github.sha }}') {
            Write-Host 'A newer commit superseded this build; release skipped.'
            exit 0
          }
          gh release view v0.14b --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.14b DW2_DW3_Viewer_0.14b_Windows_x64.zip windows-smoke.json SHA256SUMS.txt --target ${{ github.sha }} --repo ${{ github.repository }} --title 'DW2 / DW3 Viewer 0.14b' --notes-file RELEASE_NOTES_0.14b.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $beta = gh release view v0.14b --repo ${{ github.repository }} --json isPrerelease --jq .isPrerelease
            if ($beta -ne 'true') { throw 'Refusing to replace a stable release.' }
            gh api repos/${{ github.repository }}/git/refs/tags/v0.14b --method PATCH -f sha=${{ github.sha }} -F force=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit v0.14b --repo ${{ github.repository }} --title 'DW2 / DW3 Viewer 0.14b' --notes-file RELEASE_NOTES_0.14b.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload v0.14b DW2_DW3_Viewer_0.14b_Windows_x64.zip windows-smoke.json SHA256SUMS.txt --repo ${{ github.repository }} --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
