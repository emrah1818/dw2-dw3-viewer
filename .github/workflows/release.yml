name: Test, build and (on request) publish DW2 Mod Studio 0.99
# Windows x64 and Linux x64 builds of the Studio and the PC port.
# Publishing is manual and must wait for the in-game validation recorded in the test report.
# Other development branches only test/build; manual publishing remains available.
on:
  push:
    branches: ['development/**', 'feature/dna-overrides-v099']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Als Version v0.99 veröffentlichen'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt pytest
      - run: python tools/build_dw3_converter.py
      - run: python -m pytest -q -rs --junitxml=test-results.xml | tee test-summary.txt
        shell: bash
      - run: node --check www/app.js && node --check www/animeditor.js && node tests/test_native_anim.mjs && node tests/test_dw3_search.mjs && node tests/test_dw3_assignment.mjs
      - run: python -m pip install playwright
      - run: python integration/uitest/manual_selection.py | tee ui-manual-selection.txt
        shell: bash
      - run: python integration/uitest/dna_editor.py | tee ui-dna-editor.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-099
          path: |
            test-results.xml
            test-summary.txt
            ui-manual-selection.txt
            ui-dna-editor.txt
  viewer:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.12,<7'
      - run: python tools/build_dw3_converter.py
        env:
          CXX: cl
      - run: python -m PyInstaller --noconfirm --clean DW2_3D_Viewer_Studio.spec
      - run: python tools/smoke_windows.py dist/DW2_3D_Viewer_Studio/DW2_3D_Viewer_Studio.exe
      - name: Verify Windows version resource
        shell: pwsh
        run: |
          $v = (Get-Item 'dist/DW2_3D_Viewer_Studio/DW2_3D_Viewer_Studio.exe').VersionInfo
          if ($v.FileVersion -ne '0.99.0.0' -or $v.ProductVersion -ne '0.99') { throw 'Wrong Windows version resource' }
      - name: Package viewer
        shell: pwsh
        run: |
          $pkg = 'dist/DW2_Mod_Studio_0.99'
          Move-Item dist/DW2_3D_Viewer_Studio $pkg
          Copy-Item README.md, CHANGELOG.md, ANLEITUNG.md, RELEASE_NOTES_0.99.md, TESTERGEBNISSE_0.99.md, ANIMATIONSSYSTEM_0.96.md, EINSCHRAENKUNGEN_0.95.md, GRENZEN_ANALYSE_0.95.md, DIGITATIONSLEVEL_SCHNITTSTELLE.md, DW3_EFFEKTE_ANALYSE.md $pkg/
          Remove-Item "$pkg/_internal/tools/dw3_converter/*.obj" -ErrorAction SilentlyContinue
          Compress-Archive -Path $pkg -DestinationPath DW2_Mod_Studio_0.99_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-099
          path: |
            DW2_Mod_Studio_0.99_Windows_x64.zip
            windows-smoke.json
  port:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: emrah1818/dw2-pc-port
          ref: 0bd417d90861dbf5f67ee552b395159de2ea156b
          path: pc-port
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_port_patch.py pc-port
      - name: Install native build dependencies
        shell: pwsh
        run: |
          python -m pip install ninja
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-devel-3.4.8-mingw.tar.gz -OutFile sdl3.tar.gz
          tar -xzf sdl3.tar.gz
          "DW2_SDL3=$((Resolve-Path SDL3-3.4.8).Path)" | Out-File $env:GITHUB_ENV -Append
          "DW2_MINGW=${{ steps.msys2.outputs.msys2-location }}\mingw64" | Out-File $env:GITHUB_ENV -Append
      - name: Build compatible PC port without game data
        working-directory: pc-port
        run: python tools/build_native.py --arch x64 --release --no-disc
      - name: Verify API and synthetic engine tests
        shell: pwsh
        run: |
          $b = 'pc-port/build/native64_rel_nodisc'
          $api = & "$b/dw2.exe" --mod-api | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $api.mod_api -ne 2) { throw 'Overlay API 2 check failed' }
          if ($api.digivolve_levels -ne 1 -or $api.battle_camera -ne 1 -or $api.dna_overrides -ne 1) { throw 'Port lacks digivolve_levels/battle_camera' }
          foreach ($t in 'modconf_test', 'dna_test', 'hd_test') {
            if (Test-Path "$b/$t.exe") { & "$b/$t.exe"; if ($LASTEXITCODE -ne 0) { throw "$t failed" } }
            else { Write-Host "$t not built by this configuration" }
          }
          & "$b/dw2.exe" --check-cache
          if ($LASTEXITCODE -ne 0) { throw 'Full CD-cache regression test failed' }
          & "$b/fonts_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Font tests failed' }
          & "$b/textscript_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Text/script tests failed' }
          $api | ConvertTo-Json | Set-Content dw2_mod_api.json -Encoding utf8
      - name: Package PC port
        shell: pwsh
        run: |
          $pkg = 'DW2_PC_Port_API2_0.99'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item pc-port/build/native64_rel_nodisc/dw2.exe, pc-port/build/native64_rel_nodisc/SDL3.dll, dw2_mod_api.json $pkg/
          Copy-Item pc-port/LICENSE "$pkg/LICENSE.txt"
          Copy-Item integration/README.md "$pkg/README.md"
          Copy-Item pc-port/doc/MOD_API2.md "$pkg/MOD_API2.md"
          Copy-Item -Recurse pc-port/Languages $pkg/
          Copy-Item -Recurse pc-port/misc/fonts "$pkg/FontLicenses"
          Compress-Archive -Path $pkg -DestinationPath DW2_PC_Port_API2_0.99_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc-port-099
          path: DW2_PC_Port_API2_0.99_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: port-tests-099
          path: |
            pc-port/build/native64_rel_nodisc/hd_test.exe
            pc-port/build/native64_rel_nodisc/modconf_test.exe
            pc-port/build/native64_rel_nodisc/SDL3.dll
  viewer-linux:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.12,<7'
      - run: python tools/build_dw3_converter.py
      - run: python -m PyInstaller --noconfirm --clean DW2_3D_Viewer_Studio.spec
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Use the system's X11, GL and C++ libraries instead of the build machine's
        # PyInstaller copies libX11/libxcb/libstdc++/libexpat/libgbm from the runner. Next to a
        # newer Mesa on the user's system they make GLX fail ("Could not initialize GLX"), so they are
        # removed and the system's copies are used. The xcb-util libraries (libxcb-cursor and its helpers) stay,
        # they are often not installed.
        run: |
          cd dist/DW2_3D_Viewer_Studio/_internal
          for f in libX11.so.6 libX11-xcb.so.1 libxcb-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].so* libxcb.so.1 libxcb-glx.so.0 libxcb-randr.so.0 libxcb-render.so.0 \
                   libxcb-shape.so.0 libxcb-shm.so.0 libxcb-sync.so.1 libxcb-xfixes.so.0 libxcb-xkb.so.1 \
                   libexpat.so.1 libgbm.so.1 libstdc++.so.6 libgcc_s.so.1 libdrm.so.2; do
            rm -fv $f
          done
      - name: Smoke test of the frozen Linux build (WebGL, bridge, native extensions)
        env:
          SMOKE_REPORT: linux-smoke.json
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tools/smoke_windows.py dist/DW2_3D_Viewer_Studio/DW2_3D_Viewer_Studio
      - name: Package viewer
        run: |
          pkg=DW2_Mod_Studio_0.99_Linux
          mv dist/DW2_3D_Viewer_Studio "dist/$pkg"
          cp README.md CHANGELOG.md ANLEITUNG.md RELEASE_NOTES_0.99.md TESTERGEBNISSE_0.99.md ANIMATIONSSYSTEM_0.96.md "dist/$pkg/"
          cp integration/linux/DW2_Mod_Studio.sh "dist/$pkg/"
          chmod +x "dist/$pkg/DW2_Mod_Studio.sh" "dist/$pkg/DW2_3D_Viewer_Studio"
          rm -f dist/$pkg/_internal/tools/dw3_converter/*.o
          tar -C dist -czf DW2_Mod_Studio_0.99_Linux_x64.tar.gz "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-linux-099
          path: |
            DW2_Mod_Studio_0.99_Linux_x64.tar.gz
            linux-smoke.json
  port-linux:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: emrah1818/dw2-pc-port
          ref: 0bd417d90861dbf5f67ee552b395159de2ea156b
          path: pc-port
      - run: python3 tools/apply_port_patch.py pc-port
      - name: Toolchain and SDL3 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gcc g++ libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libgl-dev libvulkan-dev
          curl -sSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-3.4.8.tar.gz
          tar -xzf sdl.tar.gz
          cmake -S SDL3-3.4.8 -B sdlbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/sdl3inst -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_WAYLAND=OFF
          cmake --build sdlbuild
          cmake --install sdlbuild
          echo "CMAKE_PREFIX_PATH=$PWD/sdl3inst" >> $GITHUB_ENV
      - name: Build compatible PC port without game data
        working-directory: pc-port
        run: python3 tools/build_native.py --release --no-disc
      - name: Verify API and synthetic engine tests
        run: |
          b=pc-port/build/linux64_rel_nodisc
          cp -L sdl3inst/lib/libSDL3.so.0 $b/
          $b/dw2 --mod-api > dw2_mod_api.json
          python3 -c "import json; a=json.load(open('dw2_mod_api.json')); assert a['mod_api']==2 and a['digivolve_levels']==1 and a['battle_camera']==1 and a['dna_overrides']==1, a"
          $b/modconf_test
          $b/dna_test
          $b/fonts_test
          $b/textscript_test
          $b/dw2 --check-cache
      - name: Package PC port
        run: |
          b=pc-port/build/linux64_rel_nodisc
          pkg=DW2_PC_Port_API2_0.99_Linux
          mkdir -p $pkg
          cp $b/dw2 $b/libSDL3.so.0 dw2_mod_api.json $pkg/
          cp pc-port/LICENSE $pkg/LICENSE.txt
          cp integration/README.md $pkg/README.md
          cp pc-port/doc/MOD_API2.md $pkg/MOD_API2.md
          cp -r pc-port/Languages $pkg/
          cp -r pc-port/misc/fonts $pkg/FontLicenses
          chmod +x $pkg/dw2
          tar -czf DW2_PC_Port_API2_0.99_Linux_x64.tar.gz $pkg
      - uses: actions/upload-artifact@v4
        with:
          name: pc-port-linux-099
          path: DW2_PC_Port_API2_0.99_Linux_x64.tar.gz
  publish:
    needs: [viewer, port, viewer-linux, port-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-099
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: pc-port-099
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: viewer-linux-099
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: pc-port-linux-099
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: test-results-099
          path: release-assets
      - name: Publish 0.99 preview after build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz windows-smoke.json linux-smoke.json test-results.xml test-summary.txt ui-manual-selection.txt ui-dna-editor.txt > SHA256SUMS.txt
          files="*.zip *.tar.gz windows-smoke.json linux-smoke.json test-results.xml test-summary.txt ui-manual-selection.txt ui-dna-editor.txt SHA256SUMS.txt"
          # Never retag or replace an existing published build.
          if gh release view v0.99 --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo 'v0.99 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create v0.99 $files --target '${{ github.sha }}' --repo '${{ github.repository }}' --title 'DW2 Mod Studio 0.99' --latest --notes-file ../RELEASE_NOTES_0.99.md
