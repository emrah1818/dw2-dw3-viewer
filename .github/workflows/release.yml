name: Test, build and (on request) publish 0.16b
# Pushes to development branches only test and build. A release is made only when the workflow is
# started by hand with publish=true (Actions -> Run workflow); main is never required or changed.
on:
  push:
    branches: ['development/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Als Vorabversion v0.16b veröffentlichen'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt pytest
      - run: python tools/build_dw3_converter.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: node --check www/app.js && node tests/test_native_anim.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-016b
          path: test-results.xml
  viewer:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.12,<7'
      - run: python tools/build_dw3_converter.py
        env:
          CXX: cl
      - run: python -m PyInstaller --noconfirm --clean DW2_3D_Viewer_Studio.spec
      - run: python tools/smoke_windows.py dist/DW2_3D_Viewer_Studio/DW2_3D_Viewer_Studio.exe
      - name: Package viewer
        shell: pwsh
        run: |
          Copy-Item README.md, RELEASE_NOTES_0.16b.md, VALIDATION_0.16b.md, ABGLEICH_2026-11-14.md dist/DW2_3D_Viewer_Studio/
          Compress-Archive -Path dist/DW2_3D_Viewer_Studio -DestinationPath DW2_DW3_Viewer_0.16b_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-016b
          path: |
            DW2_DW3_Viewer_0.16b_Windows_x64.zip
            windows-smoke.json
  port:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: emrah1818/dw2-pc-port
          ref: c9989534d2ff4e1ef1a7c9efcd808736c8cc27c3
          path: pc-port
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_port_patch.py pc-port
      - name: Install native build dependencies
        shell: pwsh
        run: |
          python -m pip install ninja
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-devel-3.4.8-mingw.tar.gz -OutFile sdl3.tar.gz
          tar -xzf sdl3.tar.gz
          "DW2_SDL3=$((Resolve-Path SDL3-3.4.8).Path)" | Out-File $env:GITHUB_ENV -Append
          "DW2_MINGW=${{ steps.msys2.outputs.msys2-location }}\mingw64" | Out-File $env:GITHUB_ENV -Append
      - name: Build compatible PC port without game data
        working-directory: pc-port
        run: python tools/build_native.py --arch x64 --release --no-disc
      - name: Verify API and synthetic engine tests
        shell: pwsh
        run: |
          $b = 'pc-port/build/native64_rel_nodisc'
          $api = & "$b/dw2.exe" --mod-api | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $api.mod_api -ne 2) { throw 'Overlay API 2 check failed' }
          & "$b/dw2.exe" --check-cache
          if ($LASTEXITCODE -ne 0) { throw 'Full CD-cache regression test failed' }
          & "$b/fonts_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Font tests failed' }
          & "$b/textscript_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Text/script tests failed' }
          $api | ConvertTo-Json | Set-Content dw2_mod_api.json -Encoding utf8
      - name: Package PC port
        shell: pwsh
        run: |
          $pkg = 'DW2_PC_Port_API2_0.16b'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item pc-port/build/native64_rel_nodisc/dw2.exe, pc-port/build/native64_rel_nodisc/SDL3.dll, dw2_mod_api.json $pkg/
          Copy-Item pc-port/LICENSE "$pkg/LICENSE.txt"
          Copy-Item integration/README.md "$pkg/README.md"
          Copy-Item pc-port/doc/MOD_API2.md "$pkg/MOD_API2.md"
          Copy-Item -Recurse pc-port/Languages $pkg/
          Copy-Item -Recurse pc-port/misc/fonts "$pkg/FontLicenses"
          Compress-Archive -Path $pkg -DestinationPath DW2_PC_Port_API2_0.16b_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc-port-016b
          path: DW2_PC_Port_API2_0.16b_Windows_x64.zip
  publish:
    needs: [viewer, port]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-016b
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: pc-port-016b
          path: release-assets
      - name: Publish verified beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.zip windows-smoke.json > SHA256SUMS.txt
          if gh release view v0.16b --repo '${{ github.repository }}' >/dev/null 2>&1; then
            test "$(gh release view v0.16b --repo '${{ github.repository }}' --json isPrerelease --jq .isPrerelease)" = true
            gh api repos/${{ github.repository }}/git/refs/tags/v0.16b --method PATCH -f sha=${{ github.sha }} -F force=true
            gh release edit v0.16b --repo '${{ github.repository }}' --title 'DW2 / DW3 Viewer 0.16b' --notes-file ../RELEASE_NOTES_0.16b.md --prerelease
            gh release upload v0.16b *.zip windows-smoke.json SHA256SUMS.txt --repo '${{ github.repository }}' --clobber
          else
            gh release create v0.16b *.zip windows-smoke.json SHA256SUMS.txt --target '${{ github.sha }}' --repo '${{ github.repository }}' --title 'DW2 / DW3 Viewer 0.16b' --notes-file ../RELEASE_NOTES_0.16b.md --prerelease
          fi
