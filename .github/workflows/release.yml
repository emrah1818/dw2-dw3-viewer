name: Test, build and (on request) publish DW2 Mod Studio 0.98
# The dedicated release branch publishes v0.98 after every required check succeeds.
# Other development branches only test/build; manual publishing remains available.
on:
  push:
    branches: ['development/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Als Version v0.98 veröffentlichen'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt pytest
      - run: python tools/build_dw3_converter.py
      - run: python -m pytest -q -rs --junitxml=test-results.xml | tee test-summary.txt
        shell: bash
      - run: node --check www/app.js && node --check www/animeditor.js && node tests/test_native_anim.mjs && node tests/test_dw3_search.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-098
          path: |
            test-results.xml
            test-summary.txt
  viewer:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.12,<7'
      - run: python tools/build_dw3_converter.py
        env:
          CXX: cl
      - run: python -m PyInstaller --noconfirm --clean DW2_3D_Viewer_Studio.spec
      - run: python tools/smoke_windows.py dist/DW2_3D_Viewer_Studio/DW2_3D_Viewer_Studio.exe
      - name: Verify Windows version resource
        shell: pwsh
        run: |
          $v = (Get-Item 'dist/DW2_3D_Viewer_Studio/DW2_3D_Viewer_Studio.exe').VersionInfo
          if ($v.FileVersion -ne '0.98.0.0' -or $v.ProductVersion -ne '0.98') { throw 'Wrong Windows version resource' }
      - name: Package viewer
        shell: pwsh
        run: |
          $pkg = 'dist/DW2_Mod_Studio_0.98'
          Move-Item dist/DW2_3D_Viewer_Studio $pkg
          Copy-Item README.md, CHANGELOG.md, ANLEITUNG.md, RELEASE_NOTES_0.98.md, TESTERGEBNISSE_0.98.md, ANIMATIONSSYSTEM_0.96.md, EINSCHRAENKUNGEN_0.95.md, GRENZEN_ANALYSE_0.95.md, DIGITATIONSLEVEL_SCHNITTSTELLE.md, DW3_EFFEKTE_ANALYSE.md $pkg/
          Remove-Item "$pkg/_internal/tools/dw3_converter/*.obj" -ErrorAction SilentlyContinue
          Compress-Archive -Path $pkg -DestinationPath DW2_Mod_Studio_0.98_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-098
          path: |
            DW2_Mod_Studio_0.98_Windows_x64.zip
            windows-smoke.json
  port:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: emrah1818/dw2-pc-port
          ref: 84d4379b4559d363091b8a87319442641913e03d
          path: pc-port
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_port_patch.py pc-port
      - name: Install native build dependencies
        shell: pwsh
        run: |
          python -m pip install ninja
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-devel-3.4.8-mingw.tar.gz -OutFile sdl3.tar.gz
          tar -xzf sdl3.tar.gz
          "DW2_SDL3=$((Resolve-Path SDL3-3.4.8).Path)" | Out-File $env:GITHUB_ENV -Append
          "DW2_MINGW=${{ steps.msys2.outputs.msys2-location }}\mingw64" | Out-File $env:GITHUB_ENV -Append
      - name: Build compatible PC port without game data
        working-directory: pc-port
        run: python tools/build_native.py --arch x64 --release --no-disc
      - name: Verify API and synthetic engine tests
        shell: pwsh
        run: |
          $b = 'pc-port/build/native64_rel_nodisc'
          $api = & "$b/dw2.exe" --mod-api | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $api.mod_api -ne 2) { throw 'Overlay API 2 check failed' }
          if ($api.digivolve_levels -ne 1 -or $api.battle_camera -ne 1) { throw 'Port lacks digivolve_levels/battle_camera' }
          foreach ($t in 'modconf_test', 'hd_test') {
            if (Test-Path "$b/$t.exe") { & "$b/$t.exe"; if ($LASTEXITCODE -ne 0) { throw "$t failed" } }
            else { Write-Host "$t not built by this configuration" }
          }
          & "$b/dw2.exe" --check-cache
          if ($LASTEXITCODE -ne 0) { throw 'Full CD-cache regression test failed' }
          & "$b/fonts_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Font tests failed' }
          & "$b/textscript_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Text/script tests failed' }
          $api | ConvertTo-Json | Set-Content dw2_mod_api.json -Encoding utf8
      - name: Package PC port
        shell: pwsh
        run: |
          $pkg = 'DW2_PC_Port_API2_0.98'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item pc-port/build/native64_rel_nodisc/dw2.exe, pc-port/build/native64_rel_nodisc/SDL3.dll, dw2_mod_api.json $pkg/
          Copy-Item pc-port/LICENSE "$pkg/LICENSE.txt"
          Copy-Item integration/README.md "$pkg/README.md"
          Copy-Item pc-port/doc/MOD_API2.md "$pkg/MOD_API2.md"
          Copy-Item -Recurse pc-port/Languages $pkg/
          Copy-Item -Recurse pc-port/misc/fonts "$pkg/FontLicenses"
          Compress-Archive -Path $pkg -DestinationPath DW2_PC_Port_API2_0.98_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc-port-098
          path: DW2_PC_Port_API2_0.98_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: port-tests-098
          path: |
            pc-port/build/native64_rel_nodisc/hd_test.exe
            pc-port/build/native64_rel_nodisc/modconf_test.exe
            pc-port/build/native64_rel_nodisc/SDL3.dll
  publish:
    needs: [viewer, port]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/development/release-0.98')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-098
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: pc-port-098
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: test-results-098
          path: release-assets
      - name: Publish 0.98 preview after build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.zip windows-smoke.json test-results.xml test-summary.txt > SHA256SUMS.txt
          files="*.zip windows-smoke.json test-results.xml test-summary.txt SHA256SUMS.txt"
          # Never retag or replace an existing published build.
          if gh release view v0.98 --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo 'v0.98 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create v0.98 $files --target '${{ github.sha }}' --repo '${{ github.repository }}' --title 'DW2 Mod Studio 0.98' --prerelease --notes-file ../RELEASE_NOTES_0.98.md
