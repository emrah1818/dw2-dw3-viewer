name: Update release notes of an existing release
# Changes only the text, title and "latest" flag of a published release; its assets and tag stay as they are.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.98.3)'
        required: true
      notes:
        description: 'Notes file in the repository'
        required: true
      latest:
        description: 'Show as latest release on the main page'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit release text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f '${{ inputs.notes }}'
          gh release view '${{ inputs.tag }}' --repo '${{ github.repository }}' >/dev/null
          if [ '${{ inputs.latest }}' = 'true' ]; then
            gh release edit '${{ inputs.tag }}' --repo '${{ github.repository }}' --notes-file '${{ inputs.notes }}' --prerelease=false --latest
          else
            gh release edit '${{ inputs.tag }}' --repo '${{ github.repository }}' --notes-file '${{ inputs.notes }}'
          fi
          gh release view '${{ inputs.tag }}' --repo '${{ github.repository }}' --json tagName,isPrerelease,name
